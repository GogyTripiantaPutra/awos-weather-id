name: Update AWOS Weather Data (Indonesia)

on:
  schedule:
    # Jalan otomatis setiap 30 menit di server GitHub (24/7 walau PC mati)
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-awos-weather
  cancel-in-progress: false

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest AWOS Indonesia weather (JSON only)
        run: python awos_scraper.py --json-only

      - name: Commit and push updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_indonesia.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "chore(data): update AWOS Indonesia weather"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
